<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">LiberaPack system architecture</title>
<desc id="desc">Orders, products and box formats feed the deterministic packing engine and warehouse operations. Larry analyzes summaries through Evolus for operator review.</desc>
<rect width="1200" height="450" rx="24" fill="#f5f8f9"/>
<text x="65" y="56" fill="#132b38" font-family="Arial,sans-serif" font-size="30" font-weight="700">LiberaPack</text>
<text x="65" y="85" fill="#58717f" font-family="Arial,sans-serif" font-size="17">Warehouse automation architecture</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <rect x="60" y="124" width="235" height="126" rx="18" fill="#ffffff" stroke="#d9e4e6" stroke-width="2"/>
 <text x="177" y="165" font-size="18" font-weight="700" fill="#132b38">Orders</text>
 <text x="177" y="193" font-size="14" fill="#56707c">Shopify / other</text>
 <text x="177" y="212" font-size="14" fill="#56707c">channels or demo</text>
 <rect x="355" y="124" width="235" height="126" rx="18" fill="#ffffff" stroke="#d9e4e6" stroke-width="2"/>
 <text x="472" y="165" font-size="18" font-weight="700" fill="#132b38">Products &amp; boxes</text>
 <text x="472" y="193" font-size="14" fill="#56707c">SKU, relative size,</text>
 <text x="472" y="212" font-size="14" fill="#56707c">weight and packaging</text>
 <rect x="650" y="124" width="235" height="126" rx="18" fill="#132b38"/>
 <text x="767" y="165" font-size="18" font-weight="700" fill="#ffffff">Packing engine</text>
 <text x="767" y="193" font-size="14" fill="#d3e9e5">Deterministic rules</text>
 <text x="767" y="212" font-size="14" fill="#d3e9e5">and weight checks</text>
 <rect x="945" y="124" width="200" height="126" rx="18" fill="#168875"/>
 <text x="1045" y="165" font-size="18" font-weight="700" fill="#ffffff">Warehouse</text>
 <text x="1045" y="193" font-size="14" fill="#f0fff9">Picking / parcels</text>
 <text x="1045" y="212" font-size="14" fill="#f0fff9">for operators</text>
 <rect x="650" y="310" width="235" height="90" rx="18" fill="#ffffff" stroke="#168875" stroke-width="2.5"/>
 <text x="767" y="344" font-size="20" font-weight="700" fill="#132b38">Larry / Evolus</text>
 <text x="767" y="367" font-size="14" fill="#56707c">Explanations &amp; alerts</text>
 <text x="767" y="385" font-size="12" fill="#168875">Operator review required</text>
</g>
<g stroke="#168875" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path d="M295 187 H348"/><path d="M341 180 l7 7 -7 7"/>
 <path d="M590 187 H642"/><path d="M635 180 l7 7 -7 7"/>
 <path d="M885 187 H937"/><path d="M930 180 l7 7 -7 7"/>
 <path d="M767 251 V302"/><path d="M760 295 l7 7 7 -7"/>
</g>
<text x="63" y="416" fill="#8197a0" font-family="Arial,sans-serif" font-size="13">Illustrative design. The live Evolus workspace is external to this repository.</text>
</svg>