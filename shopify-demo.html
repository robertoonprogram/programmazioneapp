  <script type="module">
// ---- core.mjs ----
/** LiberaPack — domain engine. No Shopify/DOM dependencies. */
const DEFAULT_CAPACITY = 6;
const CATEGORY_ORDER = ['Olio', 'Vino', 'Pasta', 'Conserve', 'Dolci', 'Altri'];

function normalizeSku(sku) { return String(sku ?? '').trim().toUpperCase(); }
function normalizeProduct(p) {
  const units = p.spaceSixths === '' || p.spaceSixths == null ? null : Number(p.spaceSixths);
  return {
    id: String(p.id || ''), productId: String(p.productId || ''),
    sku: String(p.sku || '').trim(), name: String(p.name || '').trim(),
    category: String(p.category || 'Altri').trim(),
    location: String(p.location || '').trim(),
    spaceSixths: Number.isInteger(units) && units > 0 ? units : null,
    weightGrams: p.weightGrams === '' || p.weightGrams == null ? null : Number(p.weightGrams),
    volumeCm3: p.volumeCm3 === '' || p.volumeCm3 == null ? null : Number(p.volumeCm3),
    price: String(p.price ?? '0'), active: p.active !== false,
    productStatus: p.productStatus || 'ACTIVE'
  };
}
function validateProduct(data, capacity = DEFAULT_CAPACITY) {
  const err = [];
  if (!normalizeSku(data.sku)) err.push('SKU obbligatorio.');
  if (!String(data.name ?? '').trim()) err.push('Nome obbligatorio.');
  if (!String(data.category ?? '').trim()) err.push('Categoria obbligatoria.');
  const s = Number(data.spaceSixths);
  if (!Number.isInteger(s) || s < 1 || s > capacity) err.push(`Ingombro tra 1 e ${capacity} sesti per articolo.`);
  for (const [key, label] of [['weightGrams','Peso'], ['volumeCm3','Volume']]) {
    if (data[key] != null && data[key] !== '' && (!Number.isFinite(Number(data[key])) || Number(data[key]) < 0)) err.push(`${label} non valido.`);
  }
  return err;
}
function packableLines(order) {
  if (order.cancelledAt) return [];
  return (order.lineItems || []).map(item => ({...item, remaining: Math.max(0, Number(item.unfulfilledQuantity ?? item.quantity ?? 0))})).filter(item => item.remaining > 0);
}
function getProductForLine(item, products) {
  const byId = item.variantId && products.find(p => p.id && p.id === item.variantId);
  if (byId) return byId;
  const matches = products.filter(p => normalizeSku(p.sku) === normalizeSku(item.sku) && normalizeSku(p.sku));
  return matches.length === 1 ? matches[0] : null;
}
function aggregatePicking(orders, products, selectedIds) {
  const chosen = new Set(selectedIds || orders.map(o => o.id));
  const rows = new Map();
  for (const order of orders) {
    if (!chosen.has(order.id)) continue;
    for (const item of packableLines(order)) {
      const p = getProductForLine(item, products);
      const key = p?.id || `missing:${normalizeSku(item.sku) || item.id}`;
      if (!rows.has(key)) rows.set(key, {
        key, variantId: p?.id || item.variantId || null,
        sku: p?.sku || item.sku || 'SENZA SKU',
        name: p?.name || item.title || 'Articolo sconosciuto',
        category: p?.category || 'Da configurare',
        location: p?.location || 'Non assegnata',
        quantity: 0, orders: new Set(),
        configured: Boolean(p?.active && p?.spaceSixths && p.spaceSixths <= DEFAULT_CAPACITY),
        spaceSixths: p?.spaceSixths || null
      });
      const row = rows.get(key); row.quantity += item.remaining; row.orders.add(order.name);
      if (!p?.active || !p?.spaceSixths) row.configured = false;
    }
  }
  return [...rows.values()].map(r=>({...r, orders:[...r.orders]})).sort((a,b)=>{
    const rank = x => { const n=CATEGORY_ORDER.indexOf(x); return n < 0 ? CATEGORY_ORDER.length : n; };
    return rank(a.category)-rank(b.category) || a.location.localeCompare(b.location,'it') || a.sku.localeCompare(b.sku,'it');
  });
}
/** Best-fit decreasing, per order. Products are indivisible. */
function packOrder(order, products, capacity = DEFAULT_CAPACITY) {
  const lines = packableLines(order);
  const issues = [], pieces = [];
  if (!lines.length) return {orderId:order.id, orderName:order.name, packages:[], issues:[], units:0, ready:true};
  for (const item of lines) {
    const p = getProductForLine(item, products);
    if (!p) {issues.push(`${item.sku || item.title || 'Articolo'}: manca nel catalogo configurato.`);continue;}
    if (!p.active) {issues.push(`${p.sku}: prodotto disattivato in LiberaPack.`);continue;}
    const space = p.spaceSixths;
    if (!Number.isInteger(space) || space < 1 || space > capacity) {issues.push(`${p.sku}: ingombro non configurato o superiore a ${capacity}/6.`);continue;}
    if (item.remaining > 5000) {issues.push(`${p.sku}: quantita fuori limite operativo (5000).`);continue;}
    for (let i=0;i<item.remaining;i++) pieces.push({
      sku:p.sku, name:p.name, category:p.category, location:p.location, variantId:p.id,
      size:space, lineId:item.id
    });
  }
  // Fail closed: never print a partial packing plan if any SKU lacks a valid size.
  if (issues.length) return {orderId:order.id, orderName:order.name, packages:[], issues,units:0,ready:false};
  pieces.sort((a,b)=>b.size-a.size || a.sku.localeCompare(b.sku));
  const bins = [];
  for(const piece of pieces) {
    let chosen = null, bestRemaining = Number.POSITIVE_INFINITY;
    for (const bin of bins) {
      const rest = capacity-bin.used-piece.size;
      if (rest >= 0 && rest < bestRemaining) {chosen=bin;bestRemaining=rest;}
    }
    if (!chosen) {chosen={used:0,items:new Map()};bins.push(chosen);}
    chosen.used += piece.size;
    const key=piece.variantId || piece.sku;
    if(!chosen.items.has(key)) chosen.items.set(key,{sku:piece.sku,name:piece.name,quantity:0,size:piece.size,category:piece.category});
    chosen.items.get(key).quantity++;
  }
  return {orderId:order.id,orderName:order.name,ready:true,issues:[],units:pieces.length,
    packages:bins.map((b,i)=>({index:i+1,used:b.used,capacity,items:[...b.items.values()],orderName:order.name,orderId:order.id}))};
}
function buildPlan(orders, products, selectedIds) {
  const ids = new Set(selectedIds || orders.map(o=>o.id));
  const chosen=orders.filter(o=>ids.has(o.id));
  const packed=chosen.map(o=>packOrder(o,products));
  const picks=aggregatePicking(orders,products,[...ids]);
  return {packed,picks,orders:chosen.length,packages:packed.reduce((n,o)=>n+o.packages.length,0),
    units:picks.reduce((n,p)=>n+p.quantity,0),blocked:packed.filter(p=>!p.ready).length,
    configuredUnits:picks.filter(x=>x.configured).reduce((n,p)=>n+p.quantity,0)};
}
function csvRows(rows) {
  const cells=[['Zona','Posizione','SKU','Prodotto','Pezzi','Ordini','Sesti per pezzo','Configurato']];
  for(const r of rows) cells.push([r.category,r.location,r.sku,r.name,r.quantity,r.orders.join(' | '),r.spaceSixths??'',r.configured?'SI':'NO']);
  const esc=v=>`"${String(v??'').replaceAll('"','""')}"`;
  return '\ufeff'+cells.map(row=>row.map(esc).join(';')).join('\r\n')+'\r\n';
}
function zplClean(value) {
  return String(value??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\^~\\\r\n\x00-\x1f]/g,' ').replace(/[^\x20-\x7e]/g,'?').slice(0,85);
}
/** ZPL II for Zebra at 203 dpi / approx 100x150mm; print via raw ZPL capable service. */
function zplPacking(plan) {
  let out='';
  for (const order of plan.packed) for (const pack of order.packages) {
    out += `^XA\n^CI28\n^PW800\n^LL1200\n^FO40,35^A0N,52,48^FDLIBERAPACK / COLLO^FS\n`;
    out += `^FO40,120^A0N,82,70^FD${zplClean(order.orderName)}^FS\n`;
    out += `^FO40,225^A0N,52,48^FDCollo ${pack.index} / ${order.packages.length}^FS\n`;
    out += `^FO40,310^A0N,40,36^FDIngombro ${pack.used} / ${pack.capacity} sesti^FS\n`;
    pack.items.slice(0,12).forEach((p,i)=>{out+=`^FO40,${390+i*48}^A0N,32,27^FD${zplClean(p.sku)} x${p.quantity} ${zplClean(p.name).slice(0,30)}^FS\n`;});    out += `^FO40,1010^BY3,2,105^BCN,105,Y,N,N^FD${zplClean(order.orderName.replace('#',''))}-${pack.index}^FS\n^XZ\n`;
  }
  return out;
}
function zplPicking(rows, date) {
  let out='';
  for(const r of rows) {
    out += `^XA\n^PW800\n^LL1200\n^FO40,35^A0N,55,49^FDLIBERAPACK / PICK^FS\n`;
    out += `^FO40,125^A0N,42,37^FD${zplClean(date)} - ${zplClean(r.category)}^FS\n`;
    out += `^FO40,225^A0N,55,48^FD${zplClean(r.sku)}^FS\n^FO40,320^A0N,38,35^FD${zplClean(r.name)}^FS\n`;
    out += `^FO40,420^A0N,42,40^FDZona: ${zplClean(r.location)}^FS\n^FO40,530^A0N,99,90^FDQTA ${r.quantity}^FS\n`;
    out += `^FO40,720^A0N,32,30^FD${zplClean(r.orders.join(' / '))}^FS\n`;
    out += `^FO40,940^BY3,2,105^BCN,105,Y,N,N^FD${zplClean(r.sku)}^FS\n^XZ\n`;
  }
  return out;
}

const API_URL='shopify:admin/api/2026-10/graphql.json';
async function graphql(query, variables={}) {
  if (!window.shopify) throw new Error('App Bridge non attivo: apri LiberaPack da Shopify Admin e verifica il Client ID.');
  const resp = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
  let json;
  try {json = await resp.json();} catch {throw new Error(`Risposta Shopify non leggibile (HTTP ${resp.status}).`);}
  if(!resp.ok) throw new Error(`Shopify HTTP ${resp.status}: ${JSON.stringify(json).slice(0,230)}`);
  if (json.errors?.length) throw new Error(json.errors.map(e=>e.message).join(' · '));
  return json.data;
}
function assertUserErrors(payload, name) {
  if(payload?.userErrors?.length) throw new Error(`${name}: ${payload.userErrors.map(e=>e.message).join(' · ')}`);
  return payload;
}
function metaValue(items, key) {return (items||[]).find(x=>x.key===key)?.value;}
async function fetchCatalog() {
  const products=[];let cursor=null;let more=true;let pages=0;
  const query=`query LiberaPackProducts($cursor:String){
    productVariants(first:100,after:$cursor){
      nodes{id sku price title inventoryItem{id} product{id title productType status}
        metafields(first:20,namespace:"liberapack"){nodes{key value type}}}
      pageInfo{hasNextPage endCursor}
    }
  }`;
  while(more && pages++<30) {
    const d=await graphql(query,{cursor});
    const conn=d.productVariants;
    for(const v of conn.nodes) products.push(normalizeProduct({
      id:v.id,productId:v.product.id,inventoryItemId:v.inventoryItem?.id,
      name:v.title==='Default Title'?v.product.title:`${v.product.title} — ${v.title}`,
      productName:v.product.title,variantTitle:v.title,
      sku:v.sku,price:v.price,category:metaValue(v.metafields.nodes,'category') || v.product.productType || 'Altri',
      location:metaValue(v.metafields.nodes,'location') || '',
      spaceSixths:metaValue(v.metafields.nodes,'space_sixths') ?? null,
      weightGrams:metaValue(v.metafields.nodes,'weight_grams') ?? null,
      volumeCm3:metaValue(v.metafields.nodes,'volume_cm3') ?? null,
      active:metaValue(v.metafields.nodes,'enabled') !== 'false',productStatus:v.product.status
    }));
    // Extend normalized product with Shopify-only identifiers for editing.
    const start=products.length-conn.nodes.length;
    conn.nodes.forEach((v,i)=>{
      products[start+i].inventoryItemId=v.inventoryItem?.id;
      products[start+i].productName=v.product.title;
      products[start+i].variantTitle=v.title;
    });
    more=conn.pageInfo.hasNextPage;cursor=conn.pageInfo.endCursor;
  }
  if(more) throw new Error('Catalogo oltre 3000 varianti: serve sincronizzazione bulk per un catalogo molto grande.');
  return products;
}
async function fetchOpenOrders() {
  let orders=[];let cursor=null;let more=true;let pages=0;
  const query=`query LiberaPackOrders($cursor:String){
    orders(first:100,after:$cursor,reverse:true,sortKey:CREATED_AT,query:"fulfillment_status:unfulfilled OR fulfillment_status:partial"){
      nodes{id name createdAt cancelledAt displayFinancialStatus displayFulfillmentStatus
        lineItems(first:100){nodes{id title sku quantity unfulfilledQuantity variant{id}}pageInfo{hasNextPage}}}
      pageInfo{hasNextPage endCursor}
    }
  }`;
  while(more&&pages++<5){
    const conn=(await graphql(query,{cursor})).orders;
    for(const o of conn.nodes){
      const lines=o.lineItems.nodes;
      if(o.lineItems.pageInfo.hasNextPage) throw new Error(`Ordine ${o.name}: oltre 100 righe. Serve paginazione righe prima di stamparlo.`);
      if(o.cancelledAt || !lines.some(l=>l.unfulfilledQuantity>0))continue;
      orders.push({id:o.id,name:o.name,createdAt:o.createdAt,cancelledAt:o.cancelledAt,
        customerName:'',financialStatus:o.displayFinancialStatus,fulfillmentStatus:o.displayFulfillmentStatus,
        lineItems:lines.map(l=>({id:l.id,sku:l.sku,variantId:l.variant?.id||null,title:l.title,quantity:l.quantity,unfulfilledQuantity:l.unfulfilledQuantity}))});
    }
    more=conn.pageInfo.hasNextPage;cursor=conn.pageInfo.endCursor;
  }
  if (more) throw new Error('Più di 500 ordini aperti: restringere per data o integrare la sincronizzazione bulk.');
  return orders;
}
function mf(ownerId,key,value,type) {return {ownerId,namespace:'liberapack',key,type,value:String(value)};}
async function savePackingFields(variantId, product, previous=null) {
  const fields=[
    mf(variantId,'space_sixths',product.spaceSixths,'number_integer'),
    mf(variantId,'enabled',Boolean(product.active),'boolean'),
    mf(variantId,'location',product.location || 'Non assegnata','single_line_text_field'),
    mf(variantId,'category',product.category,'single_line_text_field')
  ];
  if(product.weightGrams!==null && product.weightGrams!=='' && product.weightGrams!==undefined) fields.push(mf(variantId,'weight_grams',Math.round(Number(product.weightGrams)),'number_integer'));
  if(product.volumeCm3!==null && product.volumeCm3!=='' && product.volumeCm3!==undefined) fields.push(mf(variantId,'volume_cm3',Math.round(Number(product.volumeCm3)),'number_integer'));
  const d=await graphql(`mutation LiberaPackMetafields($fields:[MetafieldsSetInput!]!){metafieldsSet(metafields:$fields){userErrors{message field}metafields{id}}}`,{fields});
  assertUserErrors(d.metafieldsSet,'Metafields LiberaPack');
  // Clear optional numeric data, instead of silently keeping a stale old value.
  const deletes=[];
  for(const [property,key] of [['weightGrams','weight_grams'],['volumeCm3','volume_cm3']]){
    if(previous && previous[property] != null && previous[property] !== '' && (product[property] == null || product[property] === '')){
      deletes.push({ownerId:variantId,namespace:'liberapack',key});
    }
  }
  if(deletes.length){
    const r=await graphql(`mutation LiberaPackClearMetafields($metafields:[MetafieldIdentifierInput!]!){metafieldsDelete(metafields:$metafields){deletedMetafields{key}userErrors{message field}}}`,{metafields:deletes});
    assertUserErrors(r.metafieldsDelete,'Pulizia metafield LiberaPack');
  }
}
async function updateInventorySku(inventoryItemId,sku) {
  if(!inventoryItemId) throw new Error('Variante priva di inventory item: non posso salvare lo SKU.');
  const d=await graphql(`mutation LiberaPackSku($id:ID!,$input:InventoryItemInput!){inventoryItemUpdate(id:$id,input:$input){inventoryItem{id sku} userErrors{message field}}}`,{id:inventoryItemId,input:{sku}});
  assertUserErrors(d.inventoryItemUpdate,'SKU Shopify');
}
async function updateVariantPrice(productId,variantId,price) {
  const d=await graphql(`mutation LiberaPackPrice($productId:ID!,$variants:[ProductVariantsBulkInput!]!){productVariantsBulkUpdate(productId:$productId,variants:$variants){userErrors{message field}productVariants{id price}}}`,{productId,variants:[{id:variantId,price:String(price)}]});
  assertUserErrors(d.productVariantsBulkUpdate,'Prezzo Shopify');
}
async function createShopifyProduct(data) {
  const product={title:data.name,productType:data.category,status:'DRAFT'};
  const d=await graphql(`mutation LiberaPackCreate($product:ProductCreateInput!){productCreate(product:$product){product{id variants(first:1){nodes{id inventoryItem{id}}}}userErrors{message field}}}`,{product});
  const created=assertUserErrors(d.productCreate,'Creazione prodotto').product;  if(!created?.variants?.nodes?.[0]) throw new Error('Prodotto creato come bozza, ma nessuna variante disponibile. Controlla il catalogo Shopify.');
  const variant=created.variants.nodes[0];
  try{
    await updateInventorySku(variant.inventoryItem?.id,data.sku);
    await updateVariantPrice(created.id,variant.id,data.price || '0');
    await savePackingFields(variant.id,data);
  }catch(e){throw new Error(`Prodotto bozza creato su Shopify ma configurazione incompleta: ${e.message}. Controlla in Prodotti prima di ripetere.`);}
  return variant.id;
}
async function updateShopifyProduct(old, data) {
  if (!old?.id || !old?.productId)throw new Error('ID Shopify mancante.');
  // Existing variants may share a parent product: editing the parent title impacts all siblings.
  const baseName=old.variantTitle && old.variantTitle!=='Default Title' ? data.name.split(' — ')[0] : data.name;
  const currentBase=old.productName||old.name;
  if(baseName!==currentBase || data.category!==old.category) {
    const d=await graphql(`mutation LiberaPackProductUpdate($product:ProductUpdateInput!){productUpdate(product:$product){product{id}userErrors{message field}}}`,{product:{id:old.productId,title:baseName,productType:data.category}});
    assertUserErrors(d.productUpdate,'Aggiornamento prodotto');
  }
  if(normalizeSku(data.sku)!==normalizeSku(old.sku))await updateInventorySku(old.inventoryItemId,data.sku);
  if(Number(old.price)!==Number(data.price))await updateVariantPrice(old.productId,old.id,data.price);
  await savePackingFields(old.id,data,old);
}

async function saveProduct(event){
  event.preventDefault();const data=productFromForm();const old=state.editingId?state.products.find(p=>p.id===state.editingId):null;
  const errors=validateProduct(data);
  if(!Number.isFinite(Number(data.price)) || Number(data.price)<0)errors.push('Prezzo non valido.');
  if(state.products.some(p=>p.id!==old?.id && normalizeSku(p.sku)===normalizeSku(data.sku)))errors.push('Lo SKU deve essere univoco all’interno del catalogo.');
  if(errors.length){$('modal-errors').hidden=false;$('modal-errors').textContent=errors.join(' ');return;}
  $('modal-errors').hidden=true;$('product-submit').disabled=true;$('product-submit').textContent='Salvataggio...';
  try{
    if(state.mode==='demo'){
      if(old)Object.assign(old,normalizeProduct({...old,...data}));
      else state.products.push(normalizeProduct({...data,id:'demo-v'+Date.now(),productId:'demo-p'+Date.now()}));
      demoSave();
    }else {
      if(old)await updateShopifyProduct(old,data);else await createShopifyProduct(data);
      state.products=await fetchCatalog();
    }
    $('product-dialog').close();toast('Prodotto salvato correttamente.');render();
  }catch(e){$('modal-errors').hidden=false;$('modal-errors').textContent=e.message||String(e);toast(e.message||'Errore durante il salvataggio.',true);}
  finally{$('product-submit').disabled=false;$('product-submit').textContent='Salva prodotto';}
}

const code39={
  '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
  'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
  'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
  'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'
};
function barcode39(value){
  const input=('*'+String(value||'').toUpperCase().replace(/[^0-9A-Z .$/+%-]/g,'')+'*');
  let x=11;const bars=[];
  for(const letter of input){const pattern=code39[letter];if(!pattern)continue;
    for(let i=0;i<pattern.length;i++){const w=pattern[i]==='w'?3:1;if(i%2===0)bars.push(`<rect x="${x}" y="0" width="${w}" height="55"/>`);x+=w;}
    x+=1;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 55" preserveAspectRatio="none" style="display:block;width:100%;height:52px" aria-label="Barcode ${esc(value)}">${bars.join('')}</svg>`;
}

  pop.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>${esc(documentTitle)}</title><style>
  @page {size:${landscape?'A4 portrait':'100mm 150mm'};margin:${landscape?'12mm':'0'};}
  *{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#142633;margin:0;background:#fff}.sheet{break-after:page;page-break-after:always;padding:${landscape?'3mm':'8mm'};max-width:${landscape?'190mm':'100mm'};height:${landscape?'auto':'150mm'};overflow:hidden}.sheet:last-child{break-after:auto}.sheet-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #142633;padding-bottom:12px;margin-bottom:17px}.brand{font-weight:900;font-size:16pt}.brand small{font-size:7pt;font-weight:400;display:block;letter-spacing:2px;margin-top:5px}.date{font-size:8pt;color:#70808a}.big{font-size:31pt;font-weight:900;letter-spacing:-1px}.section{margin:15px 0 7px;font-weight:800;text-transform:uppercase;font-size:10pt}.small{font-size:8pt;color:#62717a;line-height:1.5}.line{border-bottom:1px solid #ddd;padding:8px 0;font-size:10pt;display:flex;justify-content:space-between;gap:12px}.line strong{font-size:11pt}.label-qty{font-weight:900;font-size:38pt;margin:15mm 0 12mm}.label-name{font-weight:800;font-size:16pt;line-height:1.3;margin-top:12mm;max-width:85mm}.label-info{font-size:11pt;margin-top:8mm}.label-sku{font-family:monospace;font-weight:800;font-size:14pt}.label-mark{font-size:10pt;font-weight:700;letter-spacing:2px;padding:12px 0;border-bottom:2px solid #000}.barcode{margin-top:10mm}.bartext{font-size:10pt;text-align:center;font-weight:900;margin-top:3mm}.table{border-collapse:collapse;width:100%;font-size:9pt}.table th,.table td{border-bottom:1px solid #ddd;padding:6px;text-align:left}.table th{background:#f2f4f5;text-transform:uppercase;font-size:8pt}.zone{margin-top:20px}.zone h2{font-size:13pt;background:#ecf5ef;padding:9px;margin:0 0 5px}.box-part{font-size:18pt;font-weight:800;margin-top:9px}.flags{margin-top:18px;color:#a04d42;font-size:9pt}@media screen{body{background:#e9edef;padding:20px}.sheet{margin:0 auto 20px;background:white;box-shadow:0 2px 9px #aaa;min-height:${landscape?'270mm':'150mm'}}}
  </style></head><body>${pages.join('')}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),220))<\/script></body></html>`);
  pop.document.close();
}
function printPickingA4(){const p=plan();if(!p.picks.length)return;
  const blocks=groupsByCategory(p.picks).map(g=>`<section class="zone"><h2>${esc(g.name)} · ${g.qty} pezzi</h2><table class="table"><thead><tr><th>Zona</th><th>SKU</th><th>Articolo</th><th>Pezzi</th><th>OK</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td>${esc(r.location)}</td><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td style="font-weight:900;font-size:13pt">${r.quantity}</td><td>☐</td></tr>`).join('')}</tbody></table></section>`).join('');
  printHtml('LiberaPack - Picking '+dateLabel(),[`<div class="sheet"><div class="sheet-header"><div class="brand">LiberaPack<small>LA PORTA DEI SAPORI · PICKING</small></div><div class="date">${dateLabel()}</div></div><div class="big">${p.units} pezzi · ${p.orders} ordini</div><p class="small">Un solo passaggio per settore. Stampato dalla lista aggregata dei prodotti selezionati.</p>${blocks}<p class="flags">${p.blocked?'ATTENZIONE: '+p.blocked+' ordini con configurazione imballo incompleta.':''}</p></div>`],'a4');
}
function printPickLabels(){const rows=plan().picks;if(!rows.length)return;
  printHtml('LiberaPack - Etichette Picking',rows.map(r=>`<div class="sheet"><div class="label-mark">LIBERAPACK / PICKING</div><div class="small" style="margin-top:5mm">${dateLabel()} · ${esc(r.category)}</div><div class="label-name">${esc(r.name)}</div><p class="label-sku">${esc(r.sku)}</p><div class="label-info">Zona: <strong>${esc(r.location)}</strong></div><div class="label-qty">× ${r.quantity}</div><div class="barcode">${barcode39(r.sku)}</div><div class="bartext">${esc(r.sku)}</div></div>`),'labels');
}
function printPacking(){const p=plan();if(!p.packages || p.blocked)return;
  const labels=[];for(const order of p.packed)for(const b of order.packages){labels.push(`<div class="sheet"><div class="label-mark">LIBERAPACK / COLLO</div><div class="small" style="margin-top:6mm">LA PORTA DEI SAPORI</div><div class="big" style="margin-top:12mm">${esc(order.orderName)}</div><div class="box-part">COLLO ${b.index} / ${order.packages.length}</div><div class="small" style="margin:8mm 0 6mm">Ingombro: ${b.used} / 6 sesti</div><div class="section">Contenuto</div>${b.items.map(i=>`<div class="line"><span>${esc(i.sku)} · ${esc(i.name)}</span><strong>×${i.quantity}</strong></div>`).join('')}<div class="barcode">${barcode39(order.orderName.replace('#','')+'-'+b.index)}</div><div class="bartext">${esc(order.orderName)}-${b.index}</div></div>`);}printHtml('LiberaPack - Colli',labels,'labels');
}
function simulateOrder(){const id=$('demo-product')?.value,p=state.products.find(x=>x.id===id);const qty=Number($('demo-qty')?.value);if(!p){toast('Seleziona un prodotto.',true);return;}
  if(!Number.isInteger(qty)||qty<1||qty>200){toast('Quantità tra 1 e 200.',true);return;}
  const n=1055+state.orders.filter(x=>x.id.startsWith('sim-')).length;
  const orderId=`sim-${Date.now()}`;const order={id:orderId,name:'#'+n,createdAt:new Date().toISOString(),cancelledAt:null,financialStatus:'PAID',fulfillmentStatus:'UNFULFILLED',lineItems:[{id:'line-'+orderId,sku:p.sku,variantId:p.id,title:p.name,quantity:qty,unfulfilledQuantity:qty}]};
  state.orders.unshift(order);state.selected.add(orderId);demoSave();toast('Ordine demo '+order.name+' creato.');goto('orders');
}
function resetDemo(){if(!confirm('Ripristinare catalogo, ordini ed etichette demo?'))return;
  clearDemoStore('liberapack-demo-products-v2');clearDemoStore('liberapack-demo-orders-v2');state.initialized=false;state.checkedPicks.clear();reload();toast('Demo ripristinata.');
}
function handleAction(name){const p=plan();switch(name){
  case 'refresh':reload();break;
  case 'open-picking':goto('picking');break;case 'open-orders':goto('orders');break;
  case 'add-product':openProductDialog();break;
  case 'print-picking':printPickingA4();break;case 'print-pick-labels':printPickLabels();break;case 'print-packing':printPacking();break;
  case 'export-csv':download('liberapack_picking_'+localDate(new Date())+'.csv',csvRows(p.picks),'text/csv;charset=utf-8');break;
  case 'export-zpl-pick':download('liberapack_pick_'+localDate(new Date())+'.zpl',zplPicking(p.picks,dateLabel()));break;
  case 'export-zpl-pack':if(!p.blocked)download('liberapack_colli_'+localDate(new Date())+'.zpl',zplPacking(p));break;
  case 'simulate-order':simulateOrder();break;case 'reset-demo':resetDemo();break;
}}

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return;}
  const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return;}
  const edit=e.target.closest('[data-edit]');if(edit){openProductDialog(edit.dataset.edit);return;}
  const toggle=e.target.closest('[data-toggle]');if(toggle){quickToggle(toggle.dataset.toggle);return;}
  const close=e.target.closest('[data-close-dialog]');if(close){$('product-dialog').close();return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='date-filter'){state.dateFilter=t.value;render();return;}
  if(t.id==='select-all'){for(const o of visibleOrders()) t.checked?state.selected.add(o.id):state.selected.delete(o.id);render();return;}
  if(t.dataset.order){t.checked?state.selected.add(t.dataset.order):state.selected.delete(t.dataset.order);render();return;}
  if(t.dataset.pick){t.checked?state.checkedPicks.add(t.dataset.pick):state.checkedPicks.delete(t.dataset.pick);return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='order-search'){const pos=e.target.selectionStart;state.orderQuery=e.target.value;render();const input=$('order-search');input?.focus();input?.setSelectionRange(pos,pos);}
  if(e.target.id==='product-search'){const pos=e.target.selectionStart;state.productQuery=e.target.value;render();const input=$('product-search');input?.focus();input?.setSelectionRange(pos,pos);}
});
$('refresh-data').addEventListener('click',reload);
$('product-form').addEventListener('submit',saveProduct);
$('product-dialog').addEventListener('click',e=>{if(e.target===$('product-dialog'))$('product-dialog').close();});
reload();

</script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Z"/><path d="m3 7 9 4 9-4m-9 4v10M8 5l9 4"/></svg></span>
        <span><strong>LiberaPack</strong><small>SMART WAREHOUSE</small></span>
      </div>
      <div class="store-block"><span class="store-avatar">LP</span><span><strong>La Porta dei Sapori</strong><small id="store-context">Ambiente demo</small></span></div>
      <div class="nav-title">OPERAZIONI</div>
      <nav aria-label="Navigazione principale" class="menu">
        <button data-nav="dashboard" class="nav-button is-active"><span class="nav-icon">◫</span> Panoramica</button>
        <button data-nav="orders" class="nav-button"><span class="nav-icon">▤</span> Ordini Shopify <span id="nav-orders" class="nav-count">0</span></button>
        <button data-nav="picking" class="nav-button"><span class="nav-icon">≡</span> Prelievo per zona</button>        <button data-nav="packing" class="nav-button"><span class="nav-icon">▣</span> Composizione colli</button>
      </nav>
      <div class="nav-title nav-title-second">GESTIONE</div>
      <nav aria-label="Gestione" class="menu">
        <button data-nav="catalog" class="nav-button"><span class="nav-icon">◈</span> Catalogo prodotti</button>
        <button data-nav="settings" class="nav-button"><span class="nav-icon">⚙</span> Impostazioni</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="side-note"><span class="side-note-icon">✳</span><div>Dal singolo ordine al magazzino organizzato.<small>Picking aggregato e imballi automatici.</small></div></div>
      <div class="side-foot">LIBERAPACK <span>V1.0 · HACKATHON</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">OPERATIONS <span>/</span> <b id="top-breadcrumb">Panoramica</b></div>
        <div class="top-actions"><span id="sync-label" class="sync-label">Demo pronta</span><button id="refresh-data" class="btn btn-outline btn-sm">↻ &nbsp;Aggiorna dati</button><span id="mode-pill" class="mode-pill">DEMO</span></div>
      </header>
      <div class="page-container"><div id="app-banner"></div><main id="view" tabindex="-1"></main></div>
    </div>
  </div>
  <dialog id="product-dialog" class="dialog">
    <form id="product-form" class="product-form" novalidate>
      <div class="modal-top"><div><div class="eyebrow">CATALOGO · PRODOTTI</div><h2 id="modal-title">Nuovo prodotto</h2></div><button type="button" class="modal-close" data-close-dialog aria-label="Chiudi">×</button></div>
      <div id="modal-warning" class="modal-warning" hidden></div>
      <div class="form-grid">
        <label class="field">Codice / SKU <input type="text" name="sku" autocomplete="off" maxlength="64" required placeholder="OL-EVO-500" /></label>
        <label class="field">Nome prodotto <input type="text" name="name" maxlength="130" required placeholder="Olio extravergine 500 ml" /></label>
        <label class="field">Categoria <select name="category"><option>Olio</option><option>Vino</option><option>Pasta</option><option>Conserve</option><option>Dolci</option><option>Altri</option></select></label>
        <label class="field">Zona / scaffale <input type="text" name="location" maxlength="90" placeholder="A01 · Olio" /></label>
        <label class="field">Ingombro (sesti di collo) <select name="spaceSixths" required><option value="1">1/6 di collo</option><option value="2">2/6 di collo</option><option value="3">3/6 di collo</option><option value="4">4/6 di collo</option><option value="5">5/6 di collo</option><option value="6">6/6 — collo intero</option></select></label>
        <label class="field">Prezzo Shopify (€) <input type="number" name="price" min="0" step="0.01" required placeholder="0.00" /></label>
        <label class="field">Peso (grammi) · facoltativo <input type="number" name="weightGrams" min="0" step="1" placeholder="es. 800" /></label>
        <label class="field">Volume (cm³) · facoltativo <input type="number" name="volumeCm3" min="0" step="1" placeholder="es. 900" /></label>
      </div>
      <label class="toggle-line"><input name="active" type="checkbox" checked /><span><strong>Attivo per il magazzino</strong><small>Se disattivato, non verrà assegnato automaticamente ai colli.</small></span></label>
      <div id="modal-errors" role="alert" class="modal-errors" hidden></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" data-close-dialog>Annulla</button><button type="submit" id="product-submit" class="btn btn-primary">Salva prodotto</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
